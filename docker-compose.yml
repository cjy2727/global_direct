services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: globaldirect-php:latest
    build:
      context: .
      dockerfile: php/Dockerfile
    environment:
      PRODUCT_WORKER_URL: "${PRODUCT_WORKER_URL}"
      WORKER_TOKEN: "${WORKER_TOKEN}"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./src:/var/www/html/src:ro
      - ./tests:/var/www/html/tests:ro
    depends_on:
      playwright:
        condition: service_healthy

  playwright:
    image: globaldirect-playwright:latest
    build:
      context: ./worker
    init: true
    command: ["node", "--watch", "server.js"]
    environment:
      WORKER_TOKEN: "${WORKER_TOKEN}"
    volumes:
      - ./worker/server.js:/app/server.js:ro
      - ./worker/product-content.js:/app/product-content.js:ro
      - ./worker/product-options.js:/app/product-options.js:ro
      - ./worker/option-sources.js:/app/option-sources.js:ro
      - ./worker/option-collector.js:/app/option-collector.js:ro
      - ./worker/tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
