services:
  globaldirect:
    image: globaldirect:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
      - "127.0.0.1:8080:8080"
    environment:
      WORKER_TOKEN: "local_worker_token_change_me"
      SETTINGS_FILE: /app/state/settings.json
      ADMIN_AUTH_FILE: /app/state/admin-auth.json
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-http://localhost:8080}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_BROWSER_MAX_STEPS: ${AI_BROWSER_MAX_STEPS:-8}
      AI_BROWSER_TIMEOUT_SECONDS: ${AI_BROWSER_TIMEOUT_SECONDS:-40}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-100}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-1}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0}
      AI_USAGE_FILE: /app/state/ai-usage.json
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-60}
      QUEUE_MAX_LENGTH: ${QUEUE_MAX_LENGTH:-20}
      QUEUE_WAIT_TIMEOUT_SECONDS: ${QUEUE_WAIT_TIMEOUT_SECONDS:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_IP_PER_MINUTE: ${RATE_LIMIT_PER_IP_PER_MINUTE:-10}
      RATE_LIMIT_PER_USER_PER_MINUTE: ${RATE_LIMIT_PER_USER_PER_MINUTE:-10}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      JOB_RESULT_TTL_SECONDS: ${JOB_RESULT_TTL_SECONDS:-600}
      RESULT_MAX_ENTRIES: ${RESULT_MAX_ENTRIES:-500}
    volumes:
      - ./public:/var/www/html/public:ro
      - ./src:/var/www/html/src:ro
      - ./tests:/var/www/html/tests:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./worker/server.js:/app/server.js:ro
      - ./worker/config.js:/app/config.js:ro
      - ./worker/settings.js:/app/settings.js:ro
      - ./worker/admin-server.js:/app/admin-server.js:ro
      - ./worker/admin-auth.js:/app/admin-auth.js:ro
      - ./worker/admin-setup.js:/app/admin-setup.js:ro
      - ./worker/admin:/app/admin:ro
      - ./worker/ai.js:/app/ai.js:ro
      - ./worker/ai-browser.js:/app/ai-browser.js:ro
      - ./worker/jobs.js:/app/jobs.js:ro
      - ./worker/option-fallback.js:/app/option-fallback.js:ro
      - analysis-state:/app/state
      - ./worker/global-shopping.js:/app/global-shopping.js:ro
      - ./worker/product-content.js:/app/product-content.js:ro
      - ./worker/product-options.js:/app/product-options.js:ro
      - ./worker/option-sources.js:/app/option-sources.js:ro
      - ./worker/option-collector.js:/app/option-collector.js:ro
      - ./worker/tests:/app/tests:ro
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health >/dev/null && node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  analysis-state:
